[project]
name = "seavoyage"
version = "0.2.0"
description = "An improved version of searoute package for calculating the shortest sea route between two points on Earth."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache 2.0"}
keywords = ["sea route", "shortest path", "graph", "geojson", "networkx"]
authors = [
    {name = "Byeonggong Hwang", email = "bk22106@gmail.com"}
]
maintainers = [
    {name = "Byeonggong Hwang", email = "bk22106@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "folium>=0.19.5",
    "geojson>=3.2.0",
    "geopandas>=1.0.1",
    "haversine>=2.9.0",
    "networkx>=3.4.2",
    "scikit-learn>=1.6.1",
    "scipy>=1.13.0",
    "searoute>=1.4.3",
    "shapely>=2.1.0",
]

[project.urls]
Homepage = "https://github.com/a22106/seavoyage"
Repository = "https://github.com/a22106/seavoyage"
Issues = "https://github.com/a22106/seavoyage/issues"
Documentation = "https://seavoyage.readthedocs.io"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.11.7",
    "pre-commit>=3.0.0",
]
docs = [
    "myst-parser>=4.0.0",
    "sphinx-rtd-theme>=3.0.2",
    "sphinx>=7.0.0",
]
test = [
    "pytest>=8.3.5",
    "pytest-cov>=4.0.0",
]
lint = [
    "ruff>=0.11.7",
    "mypy>=1.0.0",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["seavoyage*"]

[tool.setuptools.package-data]
seavoyage = [
    "data/geojson/marnet/*",
    "data/shorelines/**/*",
    "data/samples/*",
    "data/ports/*",
]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--cov=seavoyage",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]

[tool.coverage.run]
source = ["seavoyage"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
