name: Security and Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  dependency-security:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      
    - name: Install dependencies
      run: |
        uv sync --group dev --group test --group lint
        
    - name: Run safety check
      run: |
        uv run safety check --json --output safety-report.json || true
        
    - name: Upload safety report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: safety-report
        path: safety-report.json
        
    - name: Run pip-audit
      run: |
        uv add pip-audit
        uv run pip-audit --format=json --output=pip-audit-report.json || true
        
    - name: Upload pip-audit report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pip-audit-report
        path: pip-audit-report.json

  code-quality:
    name: Code Quality and Security Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      
    - name: Install dependencies
      run: |
        uv sync --group dev --group test --group lint
        
    - name: Run ruff security checks
      run: |
        uv run ruff check --select=S --format=json --output-file=ruff-security.json . || true
        
    - name: Run bandit security scan
      run: |
        uv add bandit[toml]
        uv run bandit -r seavoyage/ -f json -o bandit-report.json || true
        
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          ruff-security.json
          bandit-report.json

  validation-tests:
    name: Input Validation Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      
    - name: Install dependencies
      run: |
        uv sync --group dev --group test
        
    - name: Run validation-specific tests
      run: |
        uv run pytest tests/ -k "validation" -v --tb=short
        
    - name: Run security-focused integration tests
      run: |
        uv run pytest tests/ -k "security" -v --tb=short || true

  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      
    - name: Install dependencies
      run: |
        uv sync
        
    - name: Check licenses
      run: |
        uv add pip-licenses
        uv run pip-licenses --format=json --output-file=licenses.json
        
    - name: Upload license report
      uses: actions/upload-artifact@v4
      with:
        name: license-report
        path: licenses.json

  # Aggregate results and create summary
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-security, code-quality, validation-tests, license-check]
    if: always()
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Create security summary
      run: |
        echo "# Security Scan Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Check if safety report exists and has vulnerabilities
        if [ -f safety-report/safety-report.json ]; then
          echo "✅ Safety scan completed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Safety scan failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Check if pip-audit report exists
        if [ -f pip-audit-report/pip-audit-report.json ]; then
          echo "✅ Pip-audit scan completed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Pip-audit scan failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Check if bandit report exists
        if [ -f security-reports/bandit-report.json ]; then
          echo "✅ Bandit security scan completed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Bandit security scan failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Check validation tests
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Validation Tests" >> $GITHUB_STEP_SUMMARY
        echo "Input validation tests: ${{ needs.validation-tests.result }}" >> $GITHUB_STEP_SUMMARY
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "- Review security reports in the artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- Address any high-severity vulnerabilities" >> $GITHUB_STEP_SUMMARY
        echo "- Update dependencies as needed" >> $GITHUB_STEP_SUMMARY 